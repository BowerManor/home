<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fade In Cards</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        .card-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .card {
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 200px;
        }
        .card img {
            width: 100%;
            border-radius: 10px;
        }
        .card a {
            display: block;
            margin-top: 10px;
            color: blue;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <button onclick="showCards()">Show Cards</button>
    <div class="card-container" id="cardContainer">
        <div class="card">
            <img src="https://via.placeholder.com/150" alt="Card 1">
            <p>Card 1 description goes here.</p>
            <a href="#">Learn More</a>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/150" alt="Card 2">
            <p>Card 2 description goes here.</p>
            <a href="#">Learn More</a>
        </div>
    </div>
    <script>
        function showCards() {
            document.getElementById('cardContainer').style.opacity = 1;
        }
    </script>
</body>
</html>
