<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        blody {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 5px;
            justify-content: center;
            padding: 20px;
            padding-bottom: 40px;
            max-width: 800px;
            margin: 0 auto;
        }
		.gallery a {
            display: block;
        }
        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            transition: transform 0.3s ease-in-out;
            cursor: pointer;
        }
        .gallery img:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
<div class blody>
    <div class="gallery">
        <a href="image1_large.png" target="_blank"><img src="img/h3.jpg" alt="Image 1" width="200"></a>
        <a href="image2_large.png" target="_blank"><img src="img/h2.jpg" alt="Image 2" width="250"></a>
        <a href="image3_large.png" target="_blank"><img src="img/hero1.jpg" alt="Image 3" width="180"></a>
        <a href="image4_large.png" target="_blank"><img src="img/hero2.jpg" alt="Image 4" width="220"></a>
		<a href="image5_large.png" target="_blank"><img src="img/h3.jpg" alt="Image 5" width="220"></a>

        <a href="image2_large.png" target="_blank"><img src="img/h2.jpg" alt="Image 2" width="250"></a>
        <a href="image3_large.png" target="_blank"><img src="img/hero1.jpg" alt="Image 3" width="180"></a>
        <a href="image4_large.png" target="_blank"><img src="img/hero2.jpg" alt="Image 4" width="220"></a>
		<a href="image5_large.png" target="_blank"><img src="img/h3.jpg" alt="Image 5" width="220"></a>
    </div>
	</div>
</body>
</html>
